{% extends "portal/base.html" %}

{% block content %}
<div class="container py-5">
    <h3>Numéros de réception des paiements</h3>

    {% for compte in comptes %}
        <div class="card mb-3">
            <div class="card-body">
                <h5>{{ compte.get_operateur_display }}</h5>
                <form method="post">
                    {% csrf_token %}
                    <input type="hidden" name="compte_id" value="{{ compte.id }}">
                    <div class="mb-2">
                        <label class="form-label">Numéro</label>
                        <input type="text" name="numero" class="form-control" value="{{ compte.numero }}">
                    </div>
                    <div class="form-check mb-2">
                        <input type="checkbox" name="actif" class="form-check-input" {% if compte.actif %}checked{% endif %}>
                        <label class="form-check-label">Actif</label>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Note (optionnel)</label>
                        <input type="text" name="note" class="form-control" value="{{ compte.note }}">
                    </div>
                    <button type="submit" class="btn btn-primary btn-sm">Enregistrer</button>
                </form>
            </div>
        </div>
    {% endfor %}

    <a href="{% url 'platform_admin:vue_ensemble' %}" class="btn btn-outline-secondary">Retour</a>
</div>
{% endblock %}
