{% extends "portal/base.html" %}

{% block content %}
<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <a href="{% url 'portal:dashboard' %}" class="btn btn-outline-secondary btn-sm">Retour</a>
        <div>
            <a href="{% url 'results:saisir_conduite' eleve.pk period.pk %}" class="btn btn-outline-primary btn-sm">
                Conduite & récompenses
            </a>
            <a href="{% url 'results:bulletin_pdf' eleve.pk period.pk %}" class="btn btn-primary btn-sm">
                Télécharger en PDF
            </a>
        </div>
    </div>

    <style>
        .bulletin-cadre {
            border: 5px {{ style_bordure_css }} {{ couleur_hex }};
            padding: 14px;
            background: #fff;
        }
        .bulletin-entete-table { width: 100%; border-collapse: collapse; }
        .col-armoiries, .col-logo { width: 15%; text-align: center; vertical-align: middle; }
        .col-etat { width: 70%; text-align: center; vertical-align: middle; }
        .armoiries, .logo-ecole { height: 65px; }
        .petit { font-size: 11px; color: #666; line-height: 1.3; }
        .nom-ecole-entete { font-size: 15px; }
        .trait { border: none; border-top: 1px solid {{ couleur_hex }}; margin: 8px 0; }

        .bulletin-ligne-infos { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
        .bulletin-ligne-infos td { text-align: center; width: 33.33%; }

        .titre-bulletin { text-align: center; color: {{ couleur_hex }}; margin: 8px 0; }

        .bulletin-infos { width: 100%; border-collapse: collapse; margin-top: 8px; }
        .bulletin-infos td { border: 1px solid #ccc; padding: 6px 8px; }
        .etiquette { font-weight: bold; background-color: #f2f2f2; width: 15%; }

        .bulletin-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        .bulletin-table th, .bulletin-table td { border: 1px solid {{ couleur_hex }}; padding: 6px; text-align: center; }
        .bulletin-table thead { background-color: {{ couleur_hex }}; color: #fff; }
        .bulletin-table .gauche { text-align: left; }

        .bulletin-totaux { width: 100%; border-collapse: collapse; margin-top: 12px; }
        .bulletin-totaux td { border: 1px solid #ccc; padding: 6px 8px; }
        .valeur-forte { font-weight: bold; color: {{ couleur_hex }}; }

        .bulletin-recompenses { width: 100%; border-collapse: collapse; margin-top: 12px; }
        .bulletin-recompenses th, .bulletin-recompenses td { border: 1px solid #ccc; padding: 8px; vertical-align: top; }
        .bulletin-recompenses thead { background-color: #f2f2f2; }
        .case { display: inline-block; width: 16px; }

        .bulletin-bas { width: 100%; margin-top: 26px; border-collapse: collapse; }
        .col-date { text-align: right; font-size: 12px; padding-bottom: 18px; }
        .col-signature-gauche, .col-signature-droite { width: 50%; text-align: center; vertical-align: bottom; }
        .espace-signature { height: 50px; }
        .cachet-img { height: 70px; }
        .label-signature { font-size: 12px; margin-top: 4px; }
        .nom-signature { font-weight: bold; }
    </style>

    {% include "results/bulletin_body.html" %}

</div>
{% endblock %}
