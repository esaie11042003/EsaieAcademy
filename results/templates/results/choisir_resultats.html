{% extends "portal/base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h3 class="mb-4">Résultats & Bulletins</h3>

            <form method="get">
                <div class="mb-3">
                    <label class="form-label">Classe</label>
                    <select name="classe_id" class="form-select" required>
                        <option value="">-- Choisir une classe --</option>
                        {% for classe in classes %}
                            <option value="{{ classe.pk }}">{{ classe.nom }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Période</label>
                    <select name="period_id" class="form-select" required>
                        <option value="">-- Choisir une période --</option>
                        {% for period in periods %}
                            <option value="{{ period.pk }}">{{ period.get_name_display }} ({{ period.school_year.nom }})</option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-100">Voir les résultats</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
