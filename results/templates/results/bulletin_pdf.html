<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Bulletin — {{ eleve.prenom }} {{ eleve.nom }}</title>
    <style>
        @page {
            size: A4;
            margin: 1.3cm;
        }
        body {
            font-family: "DejaVu Sans", Arial, sans-serif;
            font-size: 10.5px;
            color: #222;
        }

        .bulletin-cadre {
            border: 5px {{ style_bordure_css }} {{ couleur_hex }};
            padding: 12px;
        }

        .bulletin-entete-table {
            width: 100%;
            border-collapse: collapse;
        }
        .col-armoiries, .col-logo { width: 15%; text-align: center; vertical-align: middle; }
        .col-etat { width: 70%; text-align: center; vertical-align: middle; }
        .armoiries, .logo-ecole { height: 60px; }
        .petit { font-size: 8px; color: #444; line-height: 1.3; }
        .nom-ecole-entete { font-size: 12px; }

        .trait {
            border: none;
            border-top: 1px solid {{ couleur_hex }};
            margin: 6px 0;
        }

        .bulletin-ligne-infos {
            width: 100%;
            border-collapse: collapse;
            font-size: 10px;
            margin-bottom: 6px;
        }
        .bulletin-ligne-infos td {
            text-align: center;
            width: 33.33%;
        }

        .titre-bulletin {
            text-align: center;
            color: {{ couleur_hex }};
            margin: 6px 0;
            font-size: 14px;
        }

        .bulletin-infos {
            width: 100%;
            border-collapse: collapse;
            margin-top: 6px;
        }
        .bulletin-infos td {
            border: 1px solid #999;
            padding: 3px 6px;
        }
        .etiquette {
            font-weight: bold;
            background-color: #f2f2f2;
            width: 15%;
        }

        .bulletin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }
        .bulletin-table th, .bulletin-table td {
            border: 1px solid {{ couleur_hex }};
            padding: 3px 4px;
            text-align: center;
        }
        .bulletin-table thead {
            background-color: {{ couleur_hex }};
            color: #fff;
        }
        .bulletin-table .gauche { text-align: left; }

        .bulletin-totaux {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }
        .bulletin-totaux td {
            border: 1px solid #999;
            padding: 3px 6px;
        }
        .valeur-forte {
            font-weight: bold;
            color: {{ couleur_hex }};
        }

        .bulletin-recompenses {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }
        .bulletin-recompenses th, .bulletin-recompenses td {
            border: 1px solid #999;
            padding: 5px;
            vertical-align: top;
        }
        .bulletin-recompenses thead {
            background-color: #f2f2f2;
        }
        .case { display: inline-block; width: 12px; }

        .bulletin-bas {
            width: 100%;
            margin-top: 18px;
            border-collapse: collapse;
        }
        .col-date {
            text-align: right;
            font-size: 9px;
            padding-bottom: 14px;
        }
        .col-signature-gauche, .col-signature-droite {
            width: 50%;
            text-align: center;
            vertical-align: bottom;
        }
        .espace-signature {
            height: 40px;
        }
        .cachet-img {
            height: 60px;
        }
        .label-signature {
            font-size: 9px;
            margin-top: 4px;
        }
        .nom-signature {
            font-weight: bold;
            font-size: 10px;
        }
    </style>
</head>
<body>
    {% include "results/bulletin_body.html" %}
</body>
</html>
