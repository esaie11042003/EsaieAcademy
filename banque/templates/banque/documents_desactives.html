{% extends "portal/base.html" %}
{% block content %}
<div class="container py-5">
    <h3>Documents désactivés</h3>
    <table class="table table-bordered mt-4">
        <thead><tr><th>Titre</th><th>Classe</th><th>Actions</th></tr></thead>
        <tbody>
            {% for d in documents %}
                <tr><td>{{ d.titre }}</td><td>{{ d.classe.nom }}</td>
                    <td>
                        <form method="post" action="{% url 'banque:basculer_document_classe' d.pk %}" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-outline-success btn-sm">Réactiver</button>
                        </form>
                        <a href="{% url 'banque:supprimer_document_classe' d.pk %}" class="btn btn-outline-danger btn-sm">Corbeille</a>
                    </td>
                </tr>
            {% empty %}<tr><td colspan="3" class="text-muted">Aucun.</td></tr>{% endfor %}
        </tbody>
    </table>
    <a href="{% url 'banque:liste_documents_classe' %}" class="btn btn-outline-secondary">Retour</a>
</div>
{% endblock %}
