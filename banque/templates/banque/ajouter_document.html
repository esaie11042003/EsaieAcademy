{% extends "portal/base.html" %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center"><div class="col-md-6">
        <h3>Ajouter un document</h3>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3"><label class="form-label">Classe</label>{{ form.classe }}</div>
            <div class="mb-3"><label class="form-label">Titre</label>{{ form.titre }}</div>
            <div class="mb-3"><label class="form-label">Année</label>{{ form.annee }}</div>
            <div class="mb-3"><label class="form-label">Fichier</label>{{ form.fichier }}</div>
            <div class="form-check mb-3">{{ form.is_payant }}<label class="form-check-label">Payant</label></div>
            <div class="mb-3"><label class="form-label">Prix (FCFA)</label>{{ form.prix }}</div>
            <button type="submit" class="btn btn-primary">Ajouter</button>
            <a href="{% url 'banque:liste_documents_classe' %}" class="btn btn-outline-secondary">Annuler</a>
        </form>
    </div></div>
</div>
{% endblock %}
