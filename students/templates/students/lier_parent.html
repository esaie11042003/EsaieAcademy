{% extends "portal/base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h3 class="mb-3">Suivre un élève</h3>
            <p class="text-muted">
                Entre le code fourni par l'établissement de ton enfant pour suivre ses notes
                et télécharger ses bulletins.
            </p>

            {% if form.errors %}
                <div class="alert alert-danger">{{ form.code.errors }}</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    {{ form.code }}
                </div>
                <button type="submit" class="btn btn-primary w-100">Suivre cet élève</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
