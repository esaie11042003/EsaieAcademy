{% extends "portal/base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h3>Supprimer « {{ document.title }} »</h3>
            <div class="alert alert-danger">
                Cette action est <strong>définitive</strong> — le document et son fichier seront supprimés.
                Si vous n'êtes pas sûr, préférez "Désactiver" à la place.
            </div>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Confirmer la suppression</button>
                <a href="{% url 'documents:liste_documents' %}" class="btn btn-outline-secondary">Annuler</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
