{% extends "portal/base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h3>Modifier « {{ annee.nom }} »</h3>

            {% if form.errors %}
                <div class="alert alert-danger">Veuillez corriger les erreurs ci-dessous.</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Nom</label>
                    {{ form.nom }}
                </div>
                <div class="mb-3">
                    <label class="form-label">Date de début</label>
                    {{ form.date_debut }}
                </div>
                <div class="mb-3">
                    <label class="form-label">Date de fin</label>
                    {{ form.date_fin }}
                </div>
                <div class="form-check mb-3">
                    {{ form.active }}
                    <label class="form-check-label">Année active</label>
                </div>
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a href="{% url 'school:gerer_annees' %}" class="btn btn-outline-secondary">Annuler</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
