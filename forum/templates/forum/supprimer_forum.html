{% extends "portal/base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <h3>Supprimer « {{ forum.nom }} » ?</h3>
            <p class="text-muted">Cette action est définitive. Tous les messages de ce forum seront perdus.</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Confirmer la suppression</button>
                <a href="{% url 'forum:liste_forums' %}" class="btn btn-outline-secondary">Annuler</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
