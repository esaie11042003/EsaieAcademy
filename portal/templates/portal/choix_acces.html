{% extends "portal/base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <h3 class="mb-4">Comment souhaitez-vous continuer ?</h3>

            <div class="d-grid gap-3">
                <a href="{% url 'accounts:login' %}?next={% url 'portal:dashboard' %}" class="btn btn-outline-primary btn-lg">
                    J'ai déjà un compte
                </a>
                <a href="{% url 'accounts:signup' %}{% if role %}?role={{ role }}{% endif %}" class="btn btn-gold btn-lg">
                    Créer un compte
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
