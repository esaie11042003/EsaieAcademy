{% extends "portal/base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h3>{{ school.nom }}</h3>
            <p class="text-muted">Entrez le code PIN donné par l'administration de cet établissement.</p>

            {% if form.errors %}
                <div class="alert alert-danger">Code PIN incorrect.</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    {{ form.pin_code }}
                </div>
                <button type="submit" class="btn btn-primary">Entrer</button>
                <a href="{% url 'teachers:mes_ecoles' %}" class="btn btn-outline-secondary">Retour</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
