{% extends "portal/base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h3>Modifier « {{ epreuve.titre }} »</h3>

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Examen</label>
                    <select name="examen" class="form-select">
                        {% for e in examens_list %}
                            <option value="{{ e.id }}" {% if e.id == epreuve.examen_id %}selected{% endif %}>{{ e.nom }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Titre</label>
                    <input type="text" name="titre" class="form-control" value="{{ epreuve.titre }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Année</label>
                    <input type="number" name="annee" class="form-control" value="{{ epreuve.annee }}">
                </div>
                <div class="form-check mb-3">
                    <input type="checkbox" name="is_payant" class="form-check-input" {% if epreuve.is_payant %}checked{% endif %}>
                    <label class="form-check-label">Payant</label>
                </div>
                <div class="mb-3">
                    <label class="form-label">Prix (FCFA)</label>
                    <input type="number" name="prix" class="form-control" value="{{ epreuve.prix|default:'' }}">
                </div>
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a href="{% url 'examens:liste_examens' %}" class="btn btn-outline-secondary">Annuler</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
